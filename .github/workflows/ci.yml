name: CI

on:
  workflow_call:
  pull_request:
    branches: [develop, qa, prod]
  push:
    branches: [develop, qa]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixsure
          POSTGRES_PASSWORD: fixsure
          POSTGRES_DB: fixsure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixsure -d fixsure"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://fixsure:fixsure@localhost:5432/fixsure"
      WHATSAPP_MODE: "mock"
      STORE_NAME: "FixSure"
      STORE_ADDRESS: "CI"
      STORE_PHONE: "+91 00000 00000"
      STORE_HOURS: "Mon–Sat 10:00–20:00"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema=prisma/schema.postgres.prisma

      - name: Prisma db push
        run: npx prisma db push --schema=prisma/schema.postgres.prisma --skip-generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://fixsure:fixsure@localhost:5432/fixsure"

  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sonar token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN not set — skipping SonarCloud (add secret to enable)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.sonar.outputs.enabled == 'true'
        run: npm ci

      - name: SonarCloud Scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
