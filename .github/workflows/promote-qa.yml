name: Promote to QA

on:
  push:
    branches: [qa]
  workflow_dispatch:

jobs:
  quality:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-qa:
    name: Deploy QA (placeholder)
    runs-on: ubuntu-latest
    needs: quality
    environment: qa
    steps:
      - name: QA gate passed
        run: |
          echo "QA branch updated and CI passed."
          echo "Next: connect Vercel/Railway deploy for the qa branch."
          echo "Commit: ${{ github.sha }}"
